version: '3.9'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Mount saved_models so trained models persist across container rebuilds
      - ./saved_models:/app/saved_models
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
