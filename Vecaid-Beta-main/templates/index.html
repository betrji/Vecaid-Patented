<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vecaid — Stock Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Spline loaded lazily after page paint — see bottom of <body> -->
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text-light: #ffffff;
            --error-bg: #fee2e2;
            --error-text: #b91c1c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        #spline-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .card {
            width: 100%;
            max-width: 460px;
            margin: 1rem;
            padding: 2.5rem;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.4rem;
            background: #ffffff;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            text-align: center;
            color: rgba(255, 255, 255, 0.72);
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        form { display: flex; flex-direction: column; gap: 1.25rem; }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.4rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.92);
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .btn-submit {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            color: #fff;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.38);
        }

        .btn-submit:disabled { cursor: not-allowed; opacity: 0.75; }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            position: absolute;
            right: 1.1rem;
            top: 50%;
            transform: translateY(-50%);
        }

        .btn-submit.loading .btn-text { opacity: 0.55; }
        .btn-submit.loading .spinner { display: block; }

        @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

        .loading-hint {
            display: none;
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.8rem;
            margin-top: -0.5rem;
            animation: fadein 0.5s ease;
        }

        .loading-hint.visible { display: block; }

        @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

        .error-box {
            background: var(--error-bg);
            color: var(--error-text);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }

        .disclaimer {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.48);
            text-align: center;
            line-height: 1.55;
        }

        @media (max-width: 480px) { .card { padding: 1.75rem 1.25rem; } }
    </style>
</head>
<body>
    <div id="spline-bg"></div>

    <div class="card">
        <h1>Vecaid</h1>
        <p class="tagline">ML-powered next-day price direction</p>

        {% if error %}
        <div class="error-box" role="alert">{{ error }}</div>
        {% endif %}

        <form action="/info" method="post" id="predict-form">
            <div>
                <label for="ticker">Ticker Symbol</label>
                <input
                    type="text"
                    id="ticker"
                    name="ticker"
                    placeholder="e.g. AAPL, TSLA, SPY"
                    maxlength="10"
                    autocomplete="off"
                    autocapitalize="characters"
                    required
                >
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">
                <span class="btn-text">Predict</span>
                <span class="spinner" aria-hidden="true"></span>
            </button>
        </form>

        <p class="loading-hint" id="loading-hint">
            Validating ticker &amp; running ensemble inference&hellip;
        </p>

        <p class="disclaimer">
            For educational &amp; informational purposes only.<br>
            Not financial advice. Past model accuracy does not guarantee future results.
        </p>
    </div>

    <script>
        document.getElementById('predict-form').addEventListener('submit', function () {
            const btn = document.getElementById('submit-btn');
            btn.classList.add('loading');
            btn.disabled = true;
            document.getElementById('loading-hint').classList.add('visible');
        });

        // Lazy-load Spline background after first paint so it never blocks LCP
        window.addEventListener('load', function () {
            setTimeout(function () {
                const s = document.createElement('script');
                s.type = 'module';
                s.src = 'https://unpkg.com/@splinetool/viewer@1.9.72/build/spline-viewer.js';
                s.onload = function () {
                    const v = document.createElement('spline-viewer');
                    v.setAttribute('url', 'https://prod.spline.design/zzUEKTafPDHVPkX3/scene.splinecode');
                    v.style.cssText = 'width:100%;height:100%;';
                    document.getElementById('spline-bg').appendChild(v);
                };
                document.head.appendChild(s);
            }, 200);
        });
    </script>
</body>
</html>
